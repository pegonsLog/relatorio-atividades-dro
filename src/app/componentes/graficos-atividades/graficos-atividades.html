<div class="resumo-card">
  <div class="resumo-header">
    <h5>
      <hero-icon name="chart-bar" size="1.25rem"></hero-icon>
      Quantitativo por atividade
    </h5>
  </div>

  <div class="resumo-table-wrapper" *ngIf="resumo.length > 0; else semDados">
    <table class="resumo-table">
      <thead>
        <tr>
          <th class="col-cod">Código</th>
          <th>Atividade</th>
          <th class="col-num">Registros</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of resumo; trackBy: trackByKey">
          <td class="col-cod">{{ r.key }}</td>
          <td>{{ r.nome || '—' }}</td>
          <td class="col-num">{{ r.registros }}</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="2" class="total-label">Total</td>
          <td class="col-num">{{ totalRegistros }}</td>
        </tr>
      </tfoot>
    </table>
  </div>

  <ng-template #semDados>
    <div class="empty-state">
      <hero-icon name="chart-bar" size="3rem"></hero-icon>
      <p>Sem dados para exibir</p>
    </div>
  </ng-template>
</div>
